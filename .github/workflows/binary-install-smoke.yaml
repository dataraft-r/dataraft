name: Install published DataRaft binaries with pak
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/binary-install-smoke.yaml, family-lock.json]
  workflow_run:
    workflows: [DataRaft website]
    types: [completed]
  push:
    paths: [.github/workflows/binary-install-smoke.yaml]
permissions:
  contents: read
jobs:
  install:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.6'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, r: '4.6'}
          - {os: windows-2022, platform: windows-x64, r: '4.6'}
          - {os: windows-11-arm, platform: windows-arm64, r: '4.6'}
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.2'}
          - {os: windows-2022, platform: windows-x64, r: '4.2'}
          - {os: windows-11-arm, platform: windows-arm64, r: '4.4'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install pak and DataRaft from published binaries
        shell: Rscript {0}
        env:
          BINARY_PLATFORM: ${{ matrix.platform }}
        run: |
          platform <- Sys.getenv("BINARY_PLATFORM")
          base <- "https://dataraft-r.github.io/dataraft/packages"
          minor <- paste(R.version$major, strsplit(R.version$minor, ".", fixed = TRUE)[[1]][1], sep = ".")
          stopifnot(identical(minor, "${{ matrix.r }}"))
          if (startsWith(platform, "windows-")) {
            repo <- paste0(base, "/", platform)
            if (platform == "windows-arm64") {
              stopifnot(grepl("aarch64|arm64", R.version$arch, ignore.case = TRUE))
            }
          } else {
            arch <- if (platform == "linux-arm64") "arm64" else "x86_64"
            repo <- paste0(base, "/linux/noble-", arch, "/", minor)
          }
          options(repos = c(DataRaft = repo, CRAN = getOption("repos")[["CRAN"]]))
          modern_arm <- FALSE
          if (platform == "windows-arm64" && minor == "4.6") {
            stopifnot(grepl("clang-aarch64", .Platform$pkgType, fixed = TRUE))
            modern_index <- contrib.url(repo, type = .Platform$pkgType)
            modern_arm <- tryCatch(nrow(available.packages(contriburl = modern_index)) == 7L,
              error = function(e) FALSE)
          }
          package_type <- if (modern_arm) .Platform$pkgType else if (
            .Platform$OS.type == "windows") "win.binary" else "source"
          index <- contrib.url(repo, type = package_type)
          records <- available.packages(contriburl = index)
          family <- c("dataraft", paste0("dataraft.", c("core", "lake", "adapters", "metrics", "dbt", "ide")))
          stopifnot(all(family %in% rownames(records)))
          if (!requireNamespace("pak", quietly = TRUE)) {
            pak_repo <- sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType, R.Version()$os, R.Version()$arch)
            install.packages("pak", repos = pak_repo)
          }
          if (platform == "windows-arm64" && !modern_arm) {
            # R 4.4/4.5 do not provide the native ARM binary package type.
            # R 4.6 also uses this route until the new index is published.
            # pak rejects native ARM ZIP URLs as another platform.
            fields <- as.character(records[family, c("Depends", "Imports")])
            fields <- fields[!is.na(fields)]
            dependencies <- unique(trimws(sub("\\s*\\(.*", "",
              unlist(strsplit(paste(fields, collapse = ","), ",", fixed = TRUE)))))
            dependencies <- setdiff(dependencies[nzchar(dependencies)],
              c("R", family, rownames(installed.packages())))
            if (length(dependencies)) pak::pkg_install(dependencies, ask = FALSE)
            archive_files <- records[family, "File"]
            stopifnot(all(!is.na(archive_files)),
              all(archive_files == paste0(family, "_", records[family, "Version"], ".zip")))
            order <- c("dataraft.core", "dataraft.lake", "dataraft.adapters",
              "dataraft.metrics", "dataraft.dbt", "dataraft.ide", "dataraft")
            archives <- paste0(index, "/", archive_files[match(order, family)])
            utils::install.packages(archives, repos = NULL, type = "win.binary")
          } else {
            pak::pkg_install(family, ask = FALSE)
          }
          stopifnot(all(vapply(family, requireNamespace, logical(1), quietly = TRUE)))
          for (name in family) {
            stopifnot(identical(as.character(utils::packageVersion(name)), records[name, "Version"]))
          }
