name: Install published DataRaft binaries with pak
on:
  workflow_dispatch:
  workflow_run:
    workflows: [DataRaft website]
    types: [completed]
  push:
    paths: [.github/workflows/binary-install-smoke.yaml, scripts/check-binary-install.R]
permissions:
  contents: read
jobs:
  install:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.6'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, r: '4.6'}
          - {os: windows-2022, platform: windows-x64, r: '4.6'}
          - {os: windows-11-arm, platform: windows-arm64, r: '4.6'}
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.2'}
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.3'}
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.4'}
          - {os: ubuntu-24.04, platform: linux-x64, r: '4.5'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, r: '4.2'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, r: '4.3'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, r: '4.4'}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, r: '4.5'}
          - {os: windows-2022, platform: windows-x64, r: '4.2'}
          - {os: windows-2022, platform: windows-x64, r: '4.3'}
          - {os: windows-2022, platform: windows-x64, r: '4.4'}
          - {os: windows-2022, platform: windows-x64, r: '4.5'}
          - {os: windows-11-arm, platform: windows-arm64, r: '4.4'}
          - {os: windows-11-arm, platform: windows-arm64, r: '4.5'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install published archives and verify installed bytes
        shell: Rscript {0}
        env:
          BINARY_PLATFORM: ${{ matrix.platform }}
          BINARY_R_VERSION: ${{ matrix.r }}
        run: source("scripts/check-binary-install.R")
