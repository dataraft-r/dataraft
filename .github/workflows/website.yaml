name: DataRaft website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yaml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-website
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BASE_PATH: /dataraft
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r website/requirements.txt
      - run: python website/build.py
      - run: python website/check.py
      - run: node --check website/assets/site.js
      - name: Check course in Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python website/check_training_browser.py
      - name: Retain training browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-browser
          path: ${{ runner.temp }}/training-browser
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request'
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
