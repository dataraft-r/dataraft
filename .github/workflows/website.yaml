name: DataRaft website
on:
  workflow_run:
    workflows: [Build DataRaft family binaries]
    types: [completed]
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yaml', 'scripts/assemble-binary-repository.R']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-website
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      BASE_PATH: /dataraft
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: github.event_name != 'pull_request'
        with:
          r-version: '4.6'
          use-public-rspm: false
      - run: python -m pip install -r website/requirements.txt
      - run: python website/build.py
      - name: Include complete binary release for this commit in the site
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          tag="family-binaries-$sha"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
              --json tagName --jq '[.[].tagName | select(startswith("family-binaries-"))][0] // empty')
          fi
          if [ -n "$tag" ]; then
            mkdir -p "$RUNNER_TEMP/dataraft-binaries"
            for attempt in 1 2 3 4 5; do
              if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                  --dir "$RUNNER_TEMP/dataraft-binaries" --pattern 'dataraft-*' --clobber; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not download all release assets after five attempts" >&2
                exit 1
              fi
              sleep $((attempt * 10))
            done
            Rscript scripts/assemble-binary-repository.R \
              "$RUNNER_TEMP/dataraft-binaries" website/dist/packages
            printf '%s\n' "$tag" > website/dist/packages/RELEASE.txt
          fi
      - run: python website/check.py
      - run: node --check website/assets/site.js
      - name: Check course in Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python website/check_training_browser.py
      - name: Retain training browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-browser
          path: ${{ runner.temp }}/training-browser
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request'
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
