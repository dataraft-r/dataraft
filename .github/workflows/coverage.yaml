name: Coverage
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [core, lake, adapters, metrics, dbt, catalog, ide]
    env:
      NOT_CRAN: "true"
      DATARAFT_TEST_DUCKLAKE: "false"
      DATARAFT_COVERAGE_PACKAGE: ${{ matrix.package }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Obtain pinned family sources
        run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          # Keep instrumentation on the same R version as documentation checks.
          r-version: '4.5.1'
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::covr
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
            local::packages/dataraft.ide
            local::.
      - run: Rscript scripts/coverage.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: coverage/
