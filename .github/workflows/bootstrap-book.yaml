name: Bootstrap book sources

on:
  push:
    branches: [book-v3-publish]
    paths: ['.bootstrap/**', '.github/workflows/bootstrap-book.yaml']

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: book-v3-publish
      - name: Reassemble and unpack book source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 .bootstrap/part04 .bootstrap/part05 > /tmp/book.b64
          base64 --decode /tmp/book.b64 > /tmp/book.tar.gz
          rm -rf book
          mkdir -p book
          tar -xzf /tmp/book.tar.gz -C book --strip-components=1
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-book.yaml
      - name: Commit unpacked book
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add Data Platforms with R book sources"
          git push origin HEAD:book-v3-publish
