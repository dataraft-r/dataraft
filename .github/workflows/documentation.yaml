name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  documentation:
    runs-on: ubuntu-24.04
    env:
      DATARAFT_TEST_DUCKLAKE: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Obtain pinned family sources
        run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::pkgdown
            any::DiagrammeR
            any::DiagrammeRsvg
            any::devtools
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.ide
            local::.
          needs: website
      - name: Check and build documentation
        run: |
          rmarkdown::render("README.Rmd", output_format = "github_document", quiet = TRUE)
          pkgdown::check_pkgdown()
          options(download.file.method = "curl",
                  download.file.extra = "--retry 3 --retry-all-errors")
          source("scripts/build-site.R")
        shell: Rscript {0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install accessibility test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Audit reports and catalog accessibility
        run: |
          Rscript -e 'pak::pkg_install(c("shiny", "bslib"))'
          DATARAFT_A11Y_SERVE=true Rscript scripts/accessibility/fixtures.R > accessibility-server.log 2>&1 &
          python -m http.server 8765 --directory accessibility-artifacts > accessibility-http.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 1
          done
          python -m pip install jsonschema==4.23.0
          python scripts/check-odcs-schema.py
          node scripts/accessibility/audit.cjs
      - name: Run compiler-free IDE example
        run: Rscript examples/positron-ide/demo.R
      - name: Run compiler-free example
        run: Rscript examples/checked-report/run.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: accessibility-results
          path: |
            accessibility-artifacts/
            accessibility-server.log
      - name: Check internal documentation links
        run: python scripts/check-site-links.py site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: documentation-preview
          path: site/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: pkgdown-validation-output
          path: site/
