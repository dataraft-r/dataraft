name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: ubuntu-24.04
    env:
      DATARAFT_TEST_DUCKLAKE: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: dataraft-r/dataraft.core
          path: packages/dataraft.core
      - uses: actions/checkout@v6
        with:
          repository: dataraft-r/dataraft.lake
          path: packages/dataraft.lake
      - uses: actions/checkout@v6
        with:
          repository: dataraft-r/dataraft.adapters
          path: packages/dataraft.adapters
      - uses: actions/checkout@v6
        with:
          repository: dataraft-r/dataraft.metrics
          path: packages/dataraft.metrics
      - uses: actions/checkout@v6
        with:
          repository: dataraft-r/dataraft.dbt
          path: packages/dataraft.dbt
      - uses: actions/checkout@v6
        with:
          repository: dataraft-r/dataraft.catalog
          path: packages/dataraft.catalog
      - name: Select matching component branches for coordinated pull requests
        run: bash scripts/select-family-refs.sh
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::DiagrammeR
            any::DiagrammeRsvg
            any::devtools
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
            local::.
          needs: website
      - name: Check and build documentation
        run: |
          rmarkdown::render("README.Rmd", output_format = "github_document", quiet = TRUE)
          pkgdown::check_pkgdown()
          options(download.file.method = "curl",
                  download.file.extra = "--retry 3 --retry-all-errors")
          source("scripts/build-site.R")
        shell: Rscript {0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install accessibility test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Audit reports and catalog accessibility
        run: |
          Rscript -e 'pak::pkg_install(c("shiny", "bslib"))'
          DATARAFT_A11Y_SERVE=true Rscript scripts/accessibility/fixtures.R > accessibility-server.log 2>&1 &
          python -m http.server 8765 --directory accessibility-artifacts > accessibility-http.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 1
          done
          python -m pip install jsonschema==4.23.0
          python scripts/check-odcs-schema.py
          node scripts/accessibility/audit.cjs
      - name: Run compiler-free example
        run: Rscript examples/checked-report/run.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: |
            accessibility-artifacts/
            accessibility-server.log
      - name: Check internal documentation links
        run: python scripts/check-site-links.py site
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: documentation-preview
          path: site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
