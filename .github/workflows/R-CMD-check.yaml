name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    name: R 4.5.1 (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [duckdb, ducklake]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      DATARAFT_TEST_BACKEND: ${{ matrix.backend }}
      DATARAFT_TEST_DUCKLAKE: "true"
      DATARAFT_REQUIRE_ALL_TESTS: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "false"
      DO_NOT_TRACK: "1"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Obtain pinned family sources
        run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
            local::packages/dataraft.ide
          needs: check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install pinned dbt integration engine
        run: |
          python -m venv "$RUNNER_TEMP/dataraft-dbt"
          "$RUNNER_TEMP/dataraft-dbt/bin/python" -m pip install dbt-core==1.12.5 dbt-duckdb==1.10.1 duckdb==1.5.5
          "$RUNNER_TEMP/dataraft-dbt/bin/python" -c "import dbt.cli.main, duckdb"
          echo "DATARAFT_DBT_EXECUTABLE=$RUNNER_TEMP/dataraft-dbt/bin/dbt" >> "$GITHUB_ENV"
      - name: Validate compatible family versions
        run: python scripts/check-family.py
      - name: Require every declared optional dependency
        run: Rscript scripts/check-optional.R
      - name: Check package
        run: Rscript scripts/check.R
      - name: Benchmark smoke gate
        run: Rscript scripts/benchmark-smoke.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: check-${{ matrix.backend }}
          path: check/
  compatibility:
    name: ${{ matrix.os }} / R ${{ matrix.r }} (DuckDB)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            r: '4.2.3'
          - os: windows-latest
            r: '4.5.1'
          - os: macos-latest
            r: '4.5.1'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      DATARAFT_TEST_BACKEND: duckdb
      DATARAFT_TEST_DUCKLAKE: "false"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Obtain pinned family sources
        run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          # Prefer CRAN source for macOS dependencies whose binary compression is incompatible with pak.
          extra-packages: |
            any::rcmdcheck
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
            local::packages/dataraft.ide
            ${{ runner.os == 'macOS' && 'knitr=?source' || '' }}
            ${{ runner.os == 'macOS' && 'readxl=?source' || '' }}
            ${{ runner.os == 'macOS' && 'xfun=?source' || '' }}
          needs: check
      - name: Check portable package behavior
        run: Rscript scripts/check.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}
          path: check/
  core:
    name: Core without optional integrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Obtain pinned family sources
        run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - name: Install system dependency for fs test tooling
        # fs >= 2.1.0 uses libuv headers when built from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libuv1-dev
      - name: Install only hard dependencies
        run: Rscript -e 'install.packages(c("cli", "DBI", "dplyr", "dbplyr", "tibble", "rlang", "digest", "jsonlite", "withr"))'
      - name: Install core package
        run: R CMD INSTALL packages/dataraft.core
      - name: Verify an installation without DuckDB
        run: Rscript scripts/check-core.R
      - name: Install the family and minimal test tooling
        run: |
          Rscript -e 'install.packages(c("testthat", "pkgload", "yaml"))'
          Rscript scripts/install-family.R
      - name: Run family tests without optional engines
        run: Rscript -e 'stopifnot(!requireNamespace("duckdb", quietly = TRUE)); testthat::test_local("packages/dataraft.ide", stop_on_failure = TRUE); testthat::test_local(stop_on_failure = TRUE)'
  postgres:
    name: PostgreSQL / concurrent DuckLake writers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataraft_test
          POSTGRES_USER: dataraft
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataraft -d dataraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DATARAFT_TEST_PG_CONNECTION: "host=localhost port=5432 dbname=dataraft_test user=dataraft password=test-only-password"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Obtain pinned family sources
        run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::RPostgres
            any::duckdb
            any::dm
            any::processx
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
            local::packages/dataraft.ide
            local::.
      - name: Exercise independent writers on actual PostgreSQL and DuckLake
        run: Rscript scripts/check-postgres.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-worker-results
          path: check/postgres/
