name: Nightly family HEAD compatibility
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-head:
    runs-on: ubuntu-24.04
    env:
      DATARAFT_FAMILY_MODE: head
      NOT_CRAN: 'true'
      DATARAFT_TEST_DUCKLAKE: 'false'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python scripts/checkout-family.py
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          use-public-rspm: false
          # Same immutable snapshot; Ubuntu 24.04 needs the noble binary endpoint.
          cran: ${{ runner.os == 'Linux' && 'https://packagemanager.posit.co/cran/__linux__/noble/2026-09-18' || 'https://packagemanager.posit.co/cran/2026-09-18' }}
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            local::packages/dataraft.core
            local::packages/dataraft.lake
            local::packages/dataraft.adapters
            local::packages/dataraft.metrics
            local::packages/dataraft.dbt
            local::packages/dataraft.catalog
      - run: Rscript scripts/check.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-family-check
          path: check/
